<div class="profile-page">
  <div class="page-title">
    <h1>Mon profil</h1>
    <p class="subtitle">Gère tes informations personnelles et ton mot de passe</p>
  </div>

  <div class="card">
    <h3>Informations personnelles</h3>

    <div class="form-group">
      <label>Nom</label>
      <input type="text" [(ngModel)]="name" name="name" placeholder="Ton nom" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="ton@email.com" />
    </div>

    <p class="success" *ngIf="infoMessage">{{ infoMessage }}</p>
    <p class="error" *ngIf="infoError">{{ infoError }}</p>

    <button class="save-btn" (click)="saveInfo()" [disabled]="isSavingInfo">
      {{ isSavingInfo ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
  </div>

  <div class="card">
    <h3>Changer le mot de passe</h3>

    <div class="form-group">
      <label>Mot de passe actuel</label>
      <input type="password" [(ngModel)]="currentPassword" name="currentPassword" placeholder="••••••••" />
    </div>

    <div class="form-group">
      <label>Nouveau mot de passe</label>
      <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="6 caractères minimum" />
    </div>

    <div class="form-group">
      <label>Confirmer le nouveau mot de passe</label>
      <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••" />
    </div>

    <p class="success" *ngIf="passwordMessage">{{ passwordMessage }}</p>
    <p class="error" *ngIf="passwordError">{{ passwordError }}</p>

    <button class="save-btn" (click)="savePassword()" [disabled]="isSavingPassword">
      {{ isSavingPassword ? 'Modification...' : 'Changer le mot de passe' }}
    </button>
  </div>
</div>
