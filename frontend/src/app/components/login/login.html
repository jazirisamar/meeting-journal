<div class="auth-container">
  <h2>Connexion</h2>
  <p class="subtitle">Accède à tes réunions enregistrées</p>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="ton@email.com" required />
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
    </div>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>

  <p class="switch-link">Pas encore de compte ? <a routerLink="/register">Créer un compte</a></p>
</div>
