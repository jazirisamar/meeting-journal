<div class="auth-container">
  <h2>Créer un compte</h2>
  <p class="subtitle">Commence à enregistrer tes réunions</p>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Nom</label>
      <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Ton nom" required />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="ton@email.com" required />
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="6 caractères minimum" required />
    </div>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Création...' : 'Créer mon compte' }}
    </button>
  </form>

  <p class="switch-link">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
</div>
